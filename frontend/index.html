<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chomsky AI - CTTechnologies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2a2420 0%, #1a1512 100%);
            color: #e8dcc8;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: rgba(42, 36, 32, 0.6);
            border-right: 1px solid rgba(232, 220, 200, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid rgba(232, 220, 200, 0.1);
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #d4a574;
            letter-spacing: 0.5px;
        }

        .company-text {
            font-size: 0.75rem;
            color: #a0826d;
            margin-top: 4px;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(212, 165, 116, 0.1);
            border: 1px solid rgba(212, 165, 116, 0.3);
            border-radius: 8px;
            color: #d4a574;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .new-chat-btn:hover {
            background: rgba(212, 165, 116, 0.15);
            border-color: rgba(212, 165, 116, 0.4);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(232, 220, 200, 0.1);
            background: rgba(42, 36, 32, 0.4);
            backdrop-filter: blur(10px);
        }

        .model-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(212, 165, 116, 0.15);
            border-radius: 16px;
            font-size: 0.85rem;
            color: #d4a574;
            font-weight: 500;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(212, 165, 116, 0.3);
            border-radius: 3px;
        }

        .message-wrapper {
            width: 100%;
            padding: 24px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-wrapper.user {
            background: rgba(42, 36, 32, 0.3);
        }

        .message-wrapper.assistant {
            background: transparent;
        }

        .message-content-wrapper {
            max-width: 768px;
            margin: 0 auto;
            display: flex;
            gap: 16px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .message-wrapper.user .avatar {
            background: linear-gradient(135deg, #d4a574 0%, #b8997a 100%);
            color: #1a1512;
        }

        .message-wrapper.assistant .avatar {
            background: linear-gradient(135deg, #c17a3a 0%, #d4a574 100%);
            color: #1a1512;
        }

        .message-text {
            flex: 1;
            line-height: 1.7;
            font-size: 0.95rem;
            color: #e8dcc8;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }

        .welcome-logo {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #d4a574 0%, #c17a3a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .welcome-subtitle {
            font-size: 1.1rem;
            color: #a0826d;
            margin-bottom: 40px;
        }

        .example-prompts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            max-width: 900px;
            width: 100%;
        }

        .example-card {
            padding: 16px 20px;
            background: rgba(212, 165, 116, 0.08);
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .example-card:hover {
            background: rgba(212, 165, 116, 0.12);
            border-color: rgba(212, 165, 116, 0.3);
            transform: translateY(-2px);
        }

        .example-card-title {
            font-size: 0.9rem;
            color: #d4a574;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .example-card-text {
            font-size: 0.85rem;
            color: #a0826d;
            line-height: 1.4;
        }

        .input-area {
            padding: 20px 24px 30px;
            background: rgba(26, 21, 18, 0.6);
            backdrop-filter: blur(10px);
        }

        .input-wrapper {
            max-width: 768px;
            margin: 0 auto;
            position: relative;
        }

        .input-container {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: rgba(42, 36, 32, 0.8);
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-radius: 24px;
            padding: 12px 16px;
            transition: all 0.2s;
        }

        .input-container:focus-within {
            border-color: rgba(212, 165, 116, 0.4);
            box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e8dcc8;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            resize: none;
            max-height: 200px;
            line-height: 1.5;
        }

        .input-field::placeholder {
            color: #6d5d4b;
        }

        .send-button {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #d4a574 0%, #c17a3a 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(212, 165, 116, 0.3);
        }

        .send-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .send-icon {
            width: 20px;
            height: 20px;
            stroke: #1a1512;
            stroke-width: 2;
            fill: none;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #d4a574;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }

        .error-message {
            padding: 12px 20px;
            background: rgba(255, 100, 80, 0.1);
            border: 1px solid rgba(255, 100, 80, 0.3);
            border-radius: 8px;
            color: #ff9580;
            font-size: 0.9rem;
            margin: 20px auto;
            max-width: 768px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -260px;
                z-index: 100;
                transition: left 0.3s;
            }

            .sidebar.open {
                left: 0;
            }

            .example-prompts {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_URL = '';

        function App() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);
            const [streamingMessage, setStreamingMessage] = useState('');
            const messagesEndRef = useRef(null);
            const inputRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages, streamingMessage]);

            const handleExampleClick = (text) => {
                setInput(text);
                inputRef.current?.focus();
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || isLoading) return;

                const userMessage = { role: 'user', content: input };
                setMessages(prev => [...prev, userMessage]);
                setInput('');
                setIsLoading(true);
                setError(null);
                setStreamingMessage('');

                try {
                    const response = await fetch(`${API_URL}/api/chat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            messages: [...messages, userMessage]
                        })
                    });

                    if (!response.ok) {
                        throw new Error('서버 응답 오류가 발생했습니다.');
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let accumulatedMessage = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));

                                    if (data.error) {
                                        throw new Error(data.error);
                                    }

                                    if (data.content) {
                                        accumulatedMessage += data.content;
                                        setStreamingMessage(accumulatedMessage);
                                    }

                                    if (data.done) {
                                        setMessages(prev => [...prev, {
                                            role: 'assistant',
                                            content: accumulatedMessage
                                        }]);
                                        setStreamingMessage('');
                                    }
                                } catch (parseError) {
                                    console.error('JSON parse error:', parseError);
                                }
                            }
                        }
                    }
                } catch (err) {
                    setError(err.message);
                    console.error('Error:', err);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage(e);
                }
            };

            const clearChat = () => {
                setMessages([]);
                setStreamingMessage('');
                setError(null);
            };

            return (
                <div className="app-container">
                    <div className="sidebar">
                        <div className="sidebar-header">
                            <div className="logo-text">Chomsky AI</div>
                            <div className="company-text">CTTechnologies</div>
                        </div>
                        <button className="new-chat-btn" onClick={clearChat}>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M12 5v14M5 12h14" strokeWidth="2" strokeLinecap="round"/>
                            </svg>
                            새로운 채팅
                        </button>
                    </div>

                    <div className="main-content">
                        <div className="chat-header">
                            <div className="model-badge">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <circle cx="12" cy="12" r="3" strokeWidth="2"/>
                                    <path d="M12 1v6m0 6v6M1 12h6m6 0h6" strokeWidth="2" strokeLinecap="round"/>
                                </svg>
                                GLM-4.5-Flash
                            </div>
                        </div>

                        <div className="messages-container">
                            {messages.length === 0 && !streamingMessage ? (
                                <div className="welcome-screen">
                                    <div className="welcome-logo">Chomsky</div>
                                    <div className="welcome-subtitle">무엇을 도와드릴까요?</div>

                                    <div className="example-prompts">
                                        <div className="example-card" onClick={() => handleExampleClick('Python으로 간단한 웹 크롤러를 만드는 방법을 알려주세요')}>
                                            <div className="example-card-title">📝 코딩 도움</div>
                                            <div className="example-card-text">Python 웹 크롤러 만들기</div>
                                        </div>
                                        <div className="example-card" onClick={() => handleExampleClick('최근 AI 기술 트렌드에 대해 설명해주세요')}>
                                            <div className="example-card-title">💡 지식 탐구</div>
                                            <div className="example-card-text">AI 기술 트렌드 알아보기</div>
                                        </div>
                                        <div className="example-card" onClick={() => handleExampleClick('효과적인 프레젠테이션 구성 방법을 알려주세요')}>
                                            <div className="example-card-title">🎯 업무 지원</div>
                                            <div className="example-card-text">프레젠테이션 구성하기</div>
                                        </div>
                                        <div className="example-card" onClick={() => handleExampleClick('창의적인 글쓰기 팁을 알려주세요')}>
                                            <div className="example-card-title">✨ 창작 활동</div>
                                            <div className="example-card-text">창의적 글쓰기 배우기</div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <>
                                    {messages.map((msg, idx) => (
                                        <div key={idx} className={`message-wrapper ${msg.role}`}>
                                            <div className="message-content-wrapper">
                                                <div className="avatar">
                                                    {msg.role === 'user' ? '👤' : '🤖'}
                                                </div>
                                                <div className="message-text">{msg.content}</div>
                                            </div>
                                        </div>
                                    ))}

                                    {streamingMessage && (
                                        <div className="message-wrapper assistant">
                                            <div className="message-content-wrapper">
                                                <div className="avatar">🤖</div>
                                                <div className="message-text">{streamingMessage}</div>
                                            </div>
                                        </div>
                                    )}

                                    {isLoading && !streamingMessage && (
                                        <div className="message-wrapper assistant">
                                            <div className="message-content-wrapper">
                                                <div className="avatar">🤖</div>
                                                <div className="message-text">
                                                    <div className="typing-indicator">
                                                        <div className="typing-dot"></div>
                                                        <div className="typing-dot"></div>
                                                        <div className="typing-dot"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </>
                            )}

                            {error && (
                                <div className="error-message">
                                    ⚠️ {error}
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        <div className="input-area">
                            <div className="input-wrapper">
                                <div className="input-container">
                                    <textarea
                                        ref={inputRef}
                                        className="input-field"
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyDown={handleKeyDown}
                                        placeholder="메시지를 입력하세요 (Shift+Enter로 줄바꿈)"
                                        rows="1"
                                        disabled={isLoading}
                                    />
                                    <button
                                        className="send-button"
                                        onClick={sendMessage}
                                        disabled={isLoading || !input.trim()}
                                    >
                                        <svg className="send-icon" viewBox="0 0 24 24">
                                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" strokeLinejoin="round" strokeLinecap="round"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
